<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3939FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wang-Kicau">
<meta name="description" content="Wang-Kicau — shared expense tracker for our group.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>Wang-Kicau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: ledger app with left sidebar, sticky filter strip, one working view.
   Palette from the group's references: Electric, Blue, Dare Devil, Red-Orange, Gold, Royal/Mauve, Arctic, Bitter Lime, Black.
   data-appearance (light | dark | auto, per device) picks the neutral set; data-accent (group colour theme) supplies
   fill / strong / soft / ink / text-on-fill for light and dark, and the mode block chooses which set applies. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F4F4F7; --line:#E6E6EC; --line-strong:#D0D0DA; --fg:#0B0B0F; --muted:#666675;
  --gold:#F2BB05; --owed:#D63A00; --owed-soft:#FFE9E0; --paid:#3F7A00; --paid-soft:#F1FFD1; --warn-soft:#FFF7D6;
  --side:#FAFAFC; --scrim:rgba(11,11,15,.42); --shadow:0 10px 40px rgba(11,11,15,.14); --seg-shadow:0 1px 3px rgba(11,11,15,.14);
  /* member / category palette (fill + text on fill) */
  --p0:#3939FF; --pf0:#FFFFFF; --p1:#FF5B22; --pf1:#0B0B0F; --p2:#F2BB05; --pf2:#0B0B0F; --p3:#DBB8FF; --pf3:#1A0B33;
  --p4:#AEE6ED; --pf4:#0B2A2E; --p5:#C2FF01; --pf5:#0B0B0F; --p6:#0B0B0F; --pf6:#FFFFFF; --p7:#0044FF; --pf7:#FFFFFF;
  --p8:#B83200; --pf8:#FFFFFF; --p9:#1F8796; --pf9:#FFFFFF; --p10:#7A3FE0; --pf10:#FFFFFF; --p11:#5F7F00; --pf11:#FFFFFF;
  /* accent: Electric (default) */
  --al:#3939FF; --asl:#2222D9; --aql:#EDEDFF; --ail:#3939FF; --afl:#FFFFFF;
  --ad:#7A7AFF; --asd:#5C5CF0; --aqd:#1C1C45; --aid:#9A9AFF; --afd:#0B0B1F;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --r-sm:9px;
  --accent:var(--al); --accent-strong:var(--asl); --accent-soft:var(--aql); --accent-ink:var(--ail); --accent-fg:var(--afl);
}
:root[data-accent="blue"]{--al:#0044FF;--asl:#0035C7;--aql:#E6EDFF;--ail:#0044FF;--afl:#FFFFFF;--ad:#5A86FF;--asd:#3D6CF0;--aqd:#13214A;--aid:#86A6FF;--afd:#06123A}
:root[data-accent="daredevil"]{--al:#FF5B22;--asl:#E2440D;--aql:#FFECE4;--ail:#C93F0C;--afl:#0B0B0F;--ad:#FF6B35;--asd:#E5531F;--aqd:#3A1A0E;--aid:#FF8A5C;--afd:#0B0B0F}
:root[data-accent="redorange"]{--al:#FF4502;--asl:#D93A00;--aql:#FFE9E0;--ail:#C23400;--afl:#FFFFFF;--ad:#FF5A1F;--asd:#E04408;--aqd:#3D170A;--aid:#FF8355;--afd:#0B0B0F}
:root[data-accent="gold"]{--al:#F2BB05;--asl:#D6A400;--aql:#FFF7D6;--ail:#8A6800;--afl:#0B0B0F;--ad:#F2BB05;--asd:#D6A400;--aqd:#362B05;--aid:#F5C93A;--afd:#0B0B0F}
:root[data-accent="royal"]{--al:#DBB8FF;--asl:#C79BFF;--aql:#F6EEFF;--ail:#7A3FD1;--afl:#1A0B33;--ad:#DBB8FF;--asd:#C79BFF;--aqd:#2B2140;--aid:#DBB8FF;--afd:#1A0B33}
:root[data-accent="arctic"]{--al:#AEE6ED;--asl:#8CD6DF;--aql:#EBF9FB;--ail:#1C7A86;--afl:#0B2A2E;--ad:#AEE6ED;--asd:#8CD6DF;--aqd:#152F31;--aid:#AEE6ED;--afd:#0B2A2E}
:root[data-accent="lime"]{--al:#C2FF01;--asl:#AEE600;--aql:#F4FFD6;--ail:#4C6B00;--afl:#0B0B0F;--ad:#C2FF01;--asd:#AEE600;--aqd:#243000;--aid:#C2FF01;--afd:#0B0B0F}
:root[data-accent="black"]{--al:#0B0B0F;--asl:#000000;--aql:#EFEFF2;--ail:#0B0B0F;--afl:#FFFFFF;--ad:#F2F2F5;--asd:#D6D6DC;--aqd:#26262D;--aid:#F2F2F5;--afd:#0B0B0F}
:root[data-appearance="dark"],:root[data-appearance="auto"][data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0F; --surface:#141419; --surface-2:#1C1C23; --line:#2A2A33; --line-strong:#3A3A46; --fg:#F2F2F5; --muted:#9B9BAA;
  --gold:#F2BB05; --owed:#FF7A45; --owed-soft:#3A1A0E; --paid:#C2FF01; --paid-soft:#232E05; --warn-soft:#332A08;
  --side:#0F0F14; --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5); --seg-shadow:0 1px 3px rgba(0,0,0,.45);
  --p0:#7A7AFF; --pf0:#0B0B1F; --p6:#F2F2F5; --pf6:#0B0B0F; --p7:#5A86FF; --pf7:#06123A; --p8:#FF7A45; --pf8:#0B0B0F; --p9:#5CC3D1; --pf9:#06262B; --p10:#A880F2; --pf10:#140833; --p11:#A6D600; --pf11:#0B0B0F;
  --accent:var(--ad); --accent-strong:var(--asd); --accent-soft:var(--aqd); --accent-ink:var(--aid); --accent-fg:var(--afd);
}
@media (prefers-color-scheme: dark){ :root[data-appearance="auto"]:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B0B0F; --surface:#141419; --surface-2:#1C1C23; --line:#2A2A33; --line-strong:#3A3A46; --fg:#F2F2F5; --muted:#9B9BAA;
  --gold:#F2BB05; --owed:#FF7A45; --owed-soft:#3A1A0E; --paid:#C2FF01; --paid-soft:#232E05; --warn-soft:#332A08;
  --side:#0F0F14; --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5); --seg-shadow:0 1px 3px rgba(0,0,0,.45);
  --p0:#7A7AFF; --pf0:#0B0B1F; --p6:#F2F2F5; --pf6:#0B0B0F; --p7:#5A86FF; --pf7:#06123A; --p8:#FF7A45; --pf8:#0B0B0F; --p9:#5CC3D1; --pf9:#06262B; --p10:#A880F2; --pf10:#140833; --p11:#A6D600; --pf11:#0B0B0F;
  --accent:var(--ad); --accent-strong:var(--asd); --accent-soft:var(--aqd); --accent-ink:var(--aid); --accent-fg:var(--afd);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5}
.app{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}
.side{position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto; border-right:1px solid var(--line); background:var(--side); padding:20px 14px; display:flex; flex-direction:column; gap:24px}
.main{min-width:0; max-width:1180px; width:100%; padding-inline:28px; padding-block:22px 72px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav-i{display:flex; gap:10px; align-items:center; width:100%; padding:9px 12px; border-radius:9px; border:0; background:none; color:var(--muted); font-weight:600; font-size:14px; cursor:pointer; text-align:left}
.nav-i:hover{background:var(--surface-2); color:var(--fg)}
.nav-i[aria-current="page"]{background:var(--accent); color:var(--accent-fg)}
.nav-group{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
.nav-h{display:flex; gap:10px; align-items:center; padding:9px 12px 4px; color:var(--fg); font-weight:700; font-size:13px}
.nav-i.sub{padding-left:40px; font-weight:500}
.pagehead{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding-bottom:12px}
.pagehead h1{font-size:24px; font-weight:800}
.pagehead p{margin:2px 0 0}
.gname{font-weight:800; font-size:15px; line-height:1.25; overflow-wrap:anywhere}
.kpis.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr)); align-items:start}
.kpi-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; width:100%; background:none; border:0; padding:0; text-align:left; cursor:pointer; color:inherit}
.kpi-head > span:first-child{display:flex; flex-direction:column}
.acc-tog{display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap; padding:4px 8px; border-radius:7px; background:var(--surface-2)}
.kpi-head:hover .acc-tog{color:var(--fg)}
.acc-chev{transition:transform .15s}
.kpi.open .acc-chev{transform:rotate(180deg)}
.acc-body{margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
.owrow{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line)}
.owamt{font-weight:700; color:var(--owed)}
.rank{width:16px; color:var(--muted); font-size:12px; text-align:right}
.hb.dim{opacity:.45}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:14px}
.tiles.acc{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.tile{display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:10px; border:1.5px solid var(--line); border-radius:var(--r-sm); background:var(--surface); cursor:pointer; text-align:left; color:var(--fg)}
.tiles.acc .tile{flex-direction:row; align-items:center}
.tile:hover{border-color:var(--line-strong)}
.tile[aria-pressed="true"]{border-color:var(--accent-ink); box-shadow:0 0 0 1px var(--accent-ink)}
.tile:disabled{cursor:not-allowed; opacity:.6}
.tl{font-weight:600; font-size:14px}
.sw{width:22px; height:22px; border-radius:50%; flex:none}
.mprev{display:flex; width:100%; height:64px; border-radius:7px; overflow:hidden; border:1px solid var(--line)}
.mprev.split{border:0; gap:0}
.mprev.split .mprev{border-radius:0; border:0}
.mprev.split{border:1px solid var(--line)}
.mside{width:26%}
.mlines{flex:1; display:flex; flex-direction:column; gap:6px; padding:10px}
.mlines span{height:5px; border-radius:3px; display:block}
.mlines .mbtn{width:36%; height:10px; margin-top:auto}
.avbtn{display:inline-flex; align-items:center; gap:2px; background:none; border:0; padding:2px; border-radius:999px; cursor:pointer; color:var(--muted)}
.avbtn:hover,.avbtn[aria-expanded="true"]{background:var(--surface-2)}
.swatches{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 0 10px 4px}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line-strong); cursor:pointer; position:relative}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.swatch.taken::after{content:""; position:absolute; width:6px; height:6px; border-radius:50%; background:var(--dot); left:50%; top:50%; transform:translate(-50%,-50%)}
.swatches{display:grid; grid-template-columns:repeat(auto-fill,26px); gap:8px}
.swnote{grid-column:1 / -1}
.pv{display:flex; flex-direction:column; align-items:flex-end; line-height:1.25}
h1,h2,h3{text-wrap:balance; margin:0; line-height:1.2; letter-spacing:-.015em}
h2{font-size:18px; font-weight:700}
h3{font-size:15px; font-weight:600}
.num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px}
a{color:var(--accent-ink)}

.top{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.mark{width:42px; height:42px; border-radius:11px; background:var(--accent); color:var(--accent-fg); display:grid; place-items:center; font-weight:800; font-size:15px; flex:none}
.brand h1{font-size:22px; font-weight:800; overflow-wrap:anywhere}
.brand p{margin:0; font-size:13px; color:var(--muted)}
.topbtns{display:flex; gap:8px; flex-wrap:wrap}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line-strong); background:var(--surface); padding:8px 14px; border-radius:var(--r-sm); cursor:pointer; font-weight:600; font-size:14px; white-space:nowrap; text-decoration:none; color:var(--fg)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.ghost:hover{color:var(--fg); background:var(--surface-2)}
.btn.danger{color:var(--owed); border-color:var(--owed)}
.btn.sm{padding:5px 10px; font-size:13px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn svg{flex:none}

.tabs{display:flex; gap:2px; margin-top:20px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.tab{background:none; border:0; padding:10px 14px; cursor:pointer; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg); border-bottom-color:var(--accent-ink)}
.tab:hover{color:var(--fg)}

.filters{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:end; border-bottom:1px solid var(--line)}
.fld{display:flex; flex-direction:column; gap:4px; min-width:0}
.fld label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600}
.ctl{background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:7px 10px; font-size:14px; min-width:0}
.ctl:focus{border-color:var(--accent-ink)}
.filters .ctl{max-width:180px}
.filters .reset{align-self:end}

.banner{margin-top:14px; padding:10px 14px; border-radius:var(--r-sm); background:var(--surface-2); color:var(--muted); font-size:13px}

main{margin-top:20px; display:flex; flex-direction:column; gap:18px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.sechead{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}

.strip{display:flex; flex-wrap:wrap; gap:8px 28px; align-items:baseline}
.strip .big{font-size:22px; font-weight:700}
.seg{display:inline-flex; background:var(--surface-2); border-radius:var(--r-sm); padding:3px; gap:2px}
.seg button{border:0; background:none; padding:5px 12px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--fg); box-shadow:var(--seg-shadow)}
.ctrls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.ledger{display:flex; flex-direction:column}
.grouphead{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 4px 8px; border-bottom:1px solid var(--line)}
.grouphead .t{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em}
.grouphead.ev .t{font-size:15px; color:var(--fg); text-transform:none; letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
.grouphead .num{font-size:13px; color:var(--muted); font-weight:600}
.xrow{display:grid; grid-template-columns:minmax(0,1fr) auto auto 28px; gap:12px; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer}
.xrow:hover{background:var(--surface-2)}
.xmain{display:flex; gap:12px; align-items:center; min-width:0}
.xdesc{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.xmeta{font-size:13px; color:var(--muted); display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.xamt{font-size:15px; font-weight:700; text-align:right}
.chev{color:var(--muted); transition:transform .15s}
.xrow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.catdot{width:10px; height:10px; border-radius:3px; flex:none}
.evtag{display:inline-flex; align-items:center; gap:4px; padding:1px 8px; border-radius:999px; background:var(--surface-2); color:var(--fg); font-size:12px; font-weight:600}
.xdetail{padding:8px 4px 16px; border-bottom:1px solid var(--line)}
.shares{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-block:8px 12px}
.share{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-sm); min-width:0}
.share .who{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.xactions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.itemlist{font-size:13px; margin:4px 0 12px; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden}
.itemlist div{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; padding:6px 10px; border-bottom:1px solid var(--line); align-items:center}
.itemlist div:last-child{border-bottom:0}
.thumb{height:84px; width:auto; border-radius:8px; border:1px solid var(--line); cursor:zoom-in; display:block; object-fit:cover; max-width:100%}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; border:0}
.pill.owed{background:var(--owed-soft); color:var(--owed)}
.pill.paid{background:var(--paid-soft); color:var(--paid)}
.pill.self{background:var(--surface-2); color:var(--muted)}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.97)}
.pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor}

.av{width:28px; height:28px; border-radius:50%; display:inline-grid; place-items:center; font-size:11px; font-weight:700; flex:none; letter-spacing:.02em}
.av.sm{width:20px; height:20px; font-size:9px}
.avs{display:inline-flex}
.avs .av{margin-left:-6px; box-shadow:0 0 0 2px var(--surface)}
.avs .av:first-child{margin-left:0}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr)); gap:18px}
.pairs{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.pair{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:var(--r-sm)}
.pairwho{display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0}
.arrow{color:var(--muted)}
.pairamt{font-size:18px; font-weight:700; color:var(--owed)}
.pairright{display:flex; flex-direction:column; align-items:end; gap:6px}
.tbl-wrap{overflow-x:auto; margin-top:12px}
table{border-collapse:collapse; width:100%; font-size:14px}
th{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
tr.hl td{background:var(--accent-soft)}
.pos{color:var(--paid)} .neg{color:var(--owed)}
.namecell{display:flex; align-items:center; gap:8px}
.hist{display:flex; flex-direction:column; margin-top:10px}
.hist div{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.kpi .v{font-size:24px; font-weight:700; margin-top:4px}
.kpi .s{font-size:13px; color:var(--muted)}
.kpi.owed .v{color:var(--owed)} .kpi.paid .v{color:var(--paid)}
.chart{width:100%; height:auto; display:block; margin-top:12px}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .axis{fill:var(--muted); font-family:var(--f-body); font-size:11px}
.chart .bar{fill:var(--accent)}
.chart .bar:hover{fill:var(--accent-strong)}
.hbars{display:flex; flex-direction:column; gap:12px; margin-top:14px}
.hb{display:grid; grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto; gap:10px; align-items:center; font-size:14px}
.hb .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:8px; min-width:0}
.hb .nm span.t{overflow:hidden; text-overflow:ellipsis}
.track{height:10px; background:var(--surface-2); border-radius:5px; overflow:hidden}
.track.two{height:16px; display:flex; flex-direction:column; gap:2px; background:transparent}
.track.two span{height:7px; border-radius:4px; display:block}
.fill{height:100%; border-radius:5px; display:block}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:6px; flex-wrap:wrap}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.toplist{display:flex; flex-direction:column; margin-top:10px}
.toplist div{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}

/* Events */
.evgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:14px}
.evcard{border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--surface)}
.evcard.closed{background:var(--surface-2)}
.evcard .top2{display:flex; justify-content:space-between; gap:8px; align-items:start}
.evcard h3{font-size:16px; display:flex; align-items:center; gap:8px; overflow-wrap:anywhere}
.evcard .tot{font-size:22px; font-weight:700}
.evstats{display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.evstats b{color:var(--fg); font-weight:600}
.evbtns{display:flex; gap:6px; flex-wrap:wrap; margin-top:auto}

.mlist{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.mrow{display:flex; align-items:center; gap:10px}
.mrow .ctl{flex:1}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:5px 6px 5px 10px; border:1px solid var(--line); border-radius:999px; font-size:13px; background:var(--surface)}
.chip button{border:0; background:none; cursor:pointer; color:var(--muted); padding:0 4px; font-size:15px; line-height:1}
.chip button:hover{color:var(--owed)}
.addrow{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.addrow .ctl{flex:1; min-width:160px}

.empty{text-align:center; padding:40px 20px}
.empty h2{margin-bottom:6px}
.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px; margin:22px auto; max-width:760px; text-align:left}
.step{padding:14px; border:1px solid var(--line); border-radius:var(--r-sm)}
.step b{color:var(--accent-ink); display:block; margin-bottom:4px}

/* Modal */
.overlay{position:fixed; inset:0; background:var(--scrim); z-index:20; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:max(16px, env(safe-area-inset-top,0px)) 16px 32px}
.modal{background:var(--surface); border-radius:var(--r); width:100%; max-width:620px; box-shadow:var(--shadow); margin-top:3vh}
.modal header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line)}
.modal .body{padding:18px; display:flex; flex-direction:column; gap:14px}
.modal footer{display:flex; justify-content:space-between; gap:8px; padding:14px 18px; border-top:1px solid var(--line); align-items:center; flex-wrap:wrap}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fld .ctl{width:100%}
.amtwrap{position:relative}
.amtwrap > span{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; pointer-events:none}
.amtwrap .ctl{padding-left:34px; width:100%}
.parts{display:flex; flex-direction:column; gap:4px}
.part{display:grid; grid-template-columns:auto minmax(0,1fr) 150px; gap:10px; align-items:center; padding:6px 8px; border-radius:var(--r-sm)}
.part:hover{background:var(--surface-2)}
.part input[type=checkbox]{width:18px; height:18px; accent-color:var(--accent-ink)}
.part .nm{display:flex; gap:8px; align-items:center; min-width:0}
.part .val{text-align:right}
.alloc{font-size:13px; padding:8px 10px; border-radius:var(--r-sm); background:var(--surface-2); display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.alloc.bad{background:var(--owed-soft); color:var(--owed)}
.alloc.ok{background:var(--paid-soft); color:var(--paid)}
.err{color:var(--owed); font-size:13px}

/* Scan */
.scan{border:1.5px dashed var(--line-strong); border-radius:var(--r); padding:14px; display:flex; gap:14px; align-items:center; background:var(--surface-2)}
.scan.drag{border-color:var(--accent-ink); background:var(--accent-soft)}
.scan.done{border-style:solid; border-color:var(--line); background:var(--accent-soft)}
.scan.bad{border-style:solid; border-color:var(--owed); background:var(--owed-soft)}
.scan .ico{width:44px; height:44px; border-radius:10px; background:var(--surface); display:grid; place-items:center; flex:none; color:var(--accent-ink); border:1px solid var(--line)}
.scan .txt{flex:1; min-width:0}
.scan .txt b{display:block}
.scan img{width:56px; height:56px; object-fit:cover; border-radius:8px; border:1px solid var(--line); flex:none}
.scan .acts{display:flex; gap:6px; flex-wrap:wrap}
.spin{width:16px; height:16px; border:2px solid var(--line-strong); border-top-color:var(--accent-ink); border-radius:50%; animation:spin .8s linear infinite; display:inline-block; vertical-align:-3px; margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.pastebox{width:100%; min-height:110px; resize:vertical}

/* Items split */
.items{display:flex; flex-direction:column; gap:8px}
.item{border:1px solid var(--line); border-radius:var(--r-sm); padding:8px; display:grid; grid-template-columns:minmax(0,1fr) 130px 30px; gap:8px; align-items:center}
.item .who{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.item{grid-template-columns:minmax(0,1fr) 130px auto 30px}
.qty{display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:999px; background:var(--glass-strong); height:38px; overflow:hidden}
.qty button{border:0; background:none; width:30px; height:100%; cursor:pointer; font-size:17px; color:var(--fg)}
.qty button:hover:not(:disabled){background:var(--surface-2)}
.qty button:disabled{opacity:.35; cursor:default}
.qty .qx{color:var(--muted); font-size:13px; padding-left:2px}
.qty input{width:34px; border:0; background:none; text-align:center; font-weight:700; padding:0; outline-offset:-2px}
.ltot{margin-left:auto; font-size:13px; color:var(--muted); padding-left:8px; white-space:nowrap}
.ltot b{color:var(--fg)}
.wchip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:2px 8px 2px 2px; display:inline-flex; align-items:center; gap:5px; font-size:12px; cursor:pointer; color:var(--muted)}
.wchip .av{opacity:.35}
.wchip[aria-pressed="true"]{border-color:var(--accent-ink); color:var(--fg); background:var(--accent-soft)}
.wchip[aria-pressed="true"] .av{opacity:1}
.item .x{border:0; background:none; cursor:pointer; color:var(--muted); font-size:18px}
.item .x:hover{color:var(--owed)}
.result{display:flex; flex-wrap:wrap; gap:6px}
.item.untagged{border-color:var(--gold); background:var(--warn-soft)}
.charges{display:flex; flex-direction:column; gap:6px}
.charge{display:grid; grid-template-columns:minmax(0,1fr) 56px 140px 30px; gap:8px; align-items:center}
.charge .pct{text-align:right}
.charge .x{border:0; background:none; cursor:pointer; color:var(--muted); font-size:18px}
.charge .x:hover{color:var(--owed)}
table.brk{font-size:13px; margin-top:8px}
table.brk th,table.brk td{padding:7px 8px}
.itemlist .chg{background:var(--surface-2)}
.result span{display:inline-flex; gap:6px; align-items:center; font-size:13px; padding:3px 8px 3px 3px; border-radius:999px; background:var(--surface-2)}

.lightbox{position:fixed; inset:0; background:rgba(10,12,14,.85); z-index:40; display:grid; place-items:center; padding:24px; cursor:zoom-out}
.lightbox img{max-width:100%; max-height:90vh; border-radius:8px}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--fg); color:var(--bg); padding:10px 14px; border-radius:var(--r-sm); z-index:50; display:flex; gap:12px; align-items:center; font-size:14px; max-width:calc(100% - 32px); box-shadow:var(--shadow)}
.toast button{background:none; border:0; color:var(--bg); font-weight:700; text-decoration:underline; cursor:pointer}
.copybox{width:100%; min-height:120px; margin-top:10px}

@media (max-width:640px){
  .xrow{grid-template-columns:minmax(0,1fr) auto 22px; row-gap:4px}
  .xrow .xstat{grid-column:1 / 2; grid-row:2}
  .xrow .xamt{grid-row:1}
  .filters .ctl{max-width:none}
  .filters .fld{flex:1 1 140px}
  .row2{grid-template-columns:1fr}
  .part{grid-template-columns:auto minmax(0,1fr) 120px}
  .item{grid-template-columns:minmax(0,1fr) auto 28px}
  .item > input.ctl{grid-column:1 / -1}
  .item .amtwrap{grid-column:1 / 2}
  .charge{grid-template-columns:minmax(0,1fr) 44px 110px 26px}
  .hb{grid-template-columns:90px minmax(0,1fr) auto}
  .app{display:block}
  .side{position:static; height:auto; padding:14px 16px 0; gap:12px; border-right:0; border-bottom:1px solid var(--line); background:var(--bg); overflow:visible}
  .nav{flex-direction:row; overflow-x:auto; gap:2px; scrollbar-width:none; padding-bottom:8px}
  .nav-group{display:contents}
  .nav-h{display:none}
  .nav-i{width:auto; white-space:nowrap; padding:8px 10px}
  .nav-i svg{display:none}
  .nav-i.sub{padding-left:10px; font-weight:600}
  .main{padding-inline:16px}
  .pagehead h1{font-size:20px}
  .owrow{grid-template-columns:minmax(0,1fr) auto}
  .owrow .btn{grid-column:1 / -1; justify-self:start}
  .scan{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

/* ===== Liquid glass layer: translucent, blurred surfaces over a soft colour field drawn from the theme ===== */
:root{
  --surface:rgba(255,255,255,.62); --surface-2:rgba(11,11,15,.045); --line:rgba(11,11,15,.08); --line-strong:rgba(11,11,15,.16); --side:transparent;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.74); --glass-border:rgba(255,255,255,.78);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.14) 38%,rgba(255,255,255,.04) 100%);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(11,11,15,.05);
  --glass-shadow:0 10px 36px rgba(40,40,110,.10),0 2px 6px rgba(40,40,110,.05);
  --blur:blur(26px) saturate(185%); --blur-strong:blur(44px) saturate(190%);
  --field-a:38%; --field-b:30%;
  --r:24px; --r-sm:14px;
}
:root[data-appearance="dark"],:root[data-appearance="auto"][data-theme="dark"]{
  --surface:rgba(40,40,52,.48); --surface-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
  --glass:rgba(26,26,34,.5); --glass-strong:rgba(30,30,40,.74); --glass-border:rgba(255,255,255,.13);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 40%,rgba(255,255,255,0) 100%);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(0,0,0,.25);
  --glass-shadow:0 12px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
  --field-a:30%; --field-b:22%;
}
@media (prefers-color-scheme: dark){ :root[data-appearance="auto"]:not([data-theme="light"]){
  --surface:rgba(40,40,52,.48); --surface-2:rgba(255,255,255,.06); --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
  --glass:rgba(26,26,34,.5); --glass-strong:rgba(30,30,40,.74); --glass-border:rgba(255,255,255,.13);
  --sheen:linear-gradient(160deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.03) 40%,rgba(255,255,255,0) 100%);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(0,0,0,.25);
  --glass-shadow:0 12px 40px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
  --field-a:30%; --field-b:22%;
}}
/* colour field behind the glass */
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(38% 46% at 10% 14%, color-mix(in srgb,var(--accent) var(--field-a),transparent), transparent 70%),
    radial-gradient(34% 42% at 92% 10%, color-mix(in srgb,var(--p1) var(--field-b),transparent), transparent 70%),
    radial-gradient(42% 50% at 84% 82%, color-mix(in srgb,var(--p3) var(--field-a),transparent), transparent 70%),
    radial-gradient(40% 48% at 18% 92%, color-mix(in srgb,var(--p4) var(--field-a),transparent), transparent 70%),
    radial-gradient(30% 36% at 52% 48%, color-mix(in srgb,var(--p5) var(--field-b),transparent), transparent 70%);
  background-size:100% 100%; animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{0%{background-position:0 0} 100%{background-position:0 0}}

/* glass panels */
.card,.kpi,.evcard,.side,.filters,.modal,.toast,.scan{-webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur)}
.card,.kpi,.evcard{background:var(--sheen),var(--glass); border:1px solid var(--glass-border); box-shadow:var(--glass-hi),var(--glass-shadow); border-radius:var(--r)}
.evcard.closed{background:var(--sheen),var(--surface-2)}
.app{grid-template-columns:262px minmax(0,1fr)}
.side{margin:14px 0 14px 14px; top:14px; height:calc(100vh - 28px); border-radius:28px; border:1px solid var(--glass-border); background:var(--sheen),var(--glass); box-shadow:var(--glass-hi),var(--glass-shadow); padding:22px 14px}
.filters{top:calc(env(safe-area-inset-top,0px) + 10px); margin-top:4px; padding:10px 14px; border:1px solid var(--glass-border); border-radius:22px; background:var(--sheen),var(--glass-strong); box-shadow:var(--glass-hi),var(--glass-shadow)}
.main{padding-block:26px 80px}
.mark{border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--accent); box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.nav-i{border-radius:14px}
.nav-i:hover{background:var(--surface-2)}
.nav-i[aria-current="page"]{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 70%),var(--accent); box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 18px color-mix(in srgb,var(--accent) 32%,transparent)}
.nav-group{border-top-color:var(--line)}

/* controls */
.btn{border-radius:999px; background:var(--sheen),var(--glass-strong); border:1px solid var(--glass-border); box-shadow:var(--glass-hi),0 2px 8px rgba(20,20,60,.06); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur)}
.btn:hover{background:var(--sheen),var(--surface)}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 65%),var(--accent); border-color:color-mix(in srgb,var(--accent) 60%,white); box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px color-mix(in srgb,var(--accent) 34%,transparent)}
.btn.primary:hover{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 65%),var(--accent-strong); border-color:var(--accent-strong)}
.btn.ghost{background:transparent; border-color:transparent; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--sheen),var(--owed-soft)}
.ctl{border-radius:12px; background:var(--glass-strong); border-color:var(--line-strong); box-shadow:inset 0 1px 2px rgba(11,11,15,.05)}
.seg{border-radius:999px; padding:3px; background:var(--surface-2); box-shadow:inset 0 1px 2px rgba(11,11,15,.06)}
.seg button{border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--sheen),var(--glass-strong); box-shadow:var(--glass-hi),0 2px 8px rgba(20,20,60,.10)}
.acc-tog{border-radius:999px; background:var(--sheen),var(--glass-strong); box-shadow:var(--glass-hi)}
.tile{border-radius:18px; background:var(--sheen),var(--glass)}
.pair,.share,.item,.step{border-radius:var(--r-sm); background:var(--sheen),var(--surface); border-color:var(--glass-border); box-shadow:var(--glass-hi)}
.item.untagged{background:var(--sheen),var(--warn-soft); border-color:var(--gold)}
.chip,.wchip{background:var(--sheen),var(--glass-strong); border-color:var(--glass-border)}
.wchip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-ink)}
.itemlist{border-color:var(--glass-border); border-radius:var(--r-sm)}
.scan{border-radius:var(--r); background:var(--sheen),var(--glass)}
.alloc{border-radius:12px}
.thumb{border-radius:12px}
.track{background:var(--surface-2)}
.chart .bar{rx:4px}

/* overlays */
.overlay{background:var(--scrim); -webkit-backdrop-filter:blur(8px) saturate(120%); backdrop-filter:blur(8px) saturate(120%)}
.modal{border-radius:28px; border:1px solid var(--glass-border); background:var(--sheen),var(--glass-strong); box-shadow:var(--glass-hi),var(--shadow); -webkit-backdrop-filter:var(--blur-strong); backdrop-filter:var(--blur-strong)}
.modal header,.modal footer{border-color:var(--line)}
.toast{border-radius:999px; padding:10px 18px; background:color-mix(in srgb,var(--fg) 80%,transparent); box-shadow:inset 0 1px 0 rgba(255,255,255,.18),var(--shadow)}

/* brand coin: always white with a blue Rp, independent of theme */
.mark{width:44px; height:44px; border-radius:13px; display:grid; place-items:center; padding:0;
  background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 60%),#3939FF;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px rgba(57,57,255,.35)}
.mark .coin{width:32px; height:32px; display:block; filter:drop-shadow(0 1.5px 2px rgba(10,10,80,.35))}
.gname{font-size:17px; letter-spacing:-.02em}
@media (max-width:640px){
  .side{position:static; margin:10px 10px 0; height:auto; border-radius:22px; padding:12px 12px 4px}
  .filters{border-radius:18px}
}
@media (prefers-reduced-motion: reduce){ body::before{animation:none} }

/* ===== standalone (GitHub Pages) additions ===== */
html,body{margin:0; min-height:100%}
img{max-width:100%}
.syncpill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; border:0; background:var(--surface-2); color:var(--muted); align-self:flex-start; cursor:pointer; font-family:inherit}
.syncpill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.syncpill.ok{color:var(--paid); background:var(--paid-soft)}
.syncpill.busy::before{animation:pulse 1.2s ease-in-out infinite}
.syncpill.warn{color:var(--gold); background:var(--warn-soft)}
.syncpill.bad{color:var(--owed); background:var(--owed-soft)}
@keyframes pulse{50%{opacity:.25}}
.lock{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:16px; background:var(--scrim); -webkit-backdrop-filter:blur(30px) saturate(160%); backdrop-filter:blur(30px) saturate(160%)}
.lockcard{max-width:400px; width:100%; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; padding:30px 26px; border-radius:30px; background:var(--sheen),var(--glass-strong); border:1px solid var(--glass-border); box-shadow:var(--glass-hi),var(--shadow)}
.lockcard h1{font-size:26px; font-weight:800}
.lockcard p{margin:0}
.lockcard .fld{width:100%}
.mark.big{width:68px; height:68px; border-radius:20px}
.mark.big .coin{width:48px; height:48px}
.thumb.missing{min-width:84px; background:var(--surface-2)}
@media (prefers-reduced-motion: reduce){ .syncpill.busy::before{animation:none} }

/* ===== phones: bottom tab bar, floating add button, sheets, collapsible filters ===== */
.tabbar,.fab,.ftoggle,.fsum,.backbtn{display:none}
.menu{padding:6px}
.menurow{display:grid; grid-template-columns:minmax(0,1fr) auto 16px; gap:10px; align-items:center; width:100%; padding:14px 12px; border:0; border-bottom:1px solid var(--line); background:none; color:var(--fg); font:inherit; text-align:left; cursor:pointer; border-radius:12px}
.menurow:last-child{border-bottom:0}
.menurow:hover{background:var(--surface-2)}
.menurow .ml{font-weight:600}
.card.morehead{display:flex; gap:14px; align-items:center}
@media (max-width:720px){
  .app{display:block; grid-template-columns:none}
  .side{display:none !important}
  .main{padding-inline:14px; padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px))}
  .pagehead{padding-bottom:10px; align-items:flex-end}

(function(){
"use strict";
const DEFAULT_CATS=["Food & Drinks","Groceries","Transport","Rent & Bills","Travel","Entertainment","Shopping","Health","Other"];
const MAX_MEMBERS=10;
const S={db:null,offline:false,readOnly:false,sample:null,assets:null,loaded:{m:false,e:false,v:false},
  members:[],expenses:[],events:[],config:{groupName:"",categories:DEFAULT_CATS.slice()},
  tab:"dashboard",trend:"week",acc:new Set(),f:{preset:"month",from:"",to:"",cat:"",person:"",event:""},status:"all",groupBy:"date",
  open:new Set(),confirmDel:null,form:null,evform:null};

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("id-ID");
const cf=new Intl.NumberFormat("id-ID",{notation:"compact",maximumFractionDigits:1});
const rp=n=>"Rp "+nf.format(Math.round(n||0));
const rpc=n=>n>=1e6||n<=-1e6?"Rp "+cf.format(n):rp(n);
const digits=s=>parseInt(String(s).replace(/\D/g,""),10)||0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const isDate=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+"T00:00:00"));
const parseD=s=>new Date(s+"T00:00:00");
const MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const dm=d=>d.getDate()+" "+MON3[d.getMonth()];
const fmtDay=s=>{const d=parseD(s);return DAY3[d.getDay()]+", "+dm(d)+" "+d.getFullYear();};
const fmtShort=s=>{const d=parseD(s);return dm(d)+" "+d.getFullYear();};
function fmtSpan(a,b){if(!a&&!b)return "";if(!b||a===b)return fmtShort(a||b);if(!a)return "until "+fmtShort(b);
  const A=parseD(a),B=parseD(b);
  if(A.getFullYear()===B.getFullYear()&&A.getMonth()===B.getMonth())return A.getDate()+"–"+fmtShort(b);
  if(A.getFullYear()===B.getFullYear())return dm(A)+" – "+fmtShort(b);

function range(){

  if(f.preset==="month"){from=ymd(new Date(n.getFullYear(),n.getMonth(),1));to=ymd(new Date(n.getFullYear(),n.getMonth()+1,0));}
  else if(f.preset==="lastmonth"){from=ymd(new Date(n.getFullYear(),n.getMonth()-1,1));to=ymd(new Date(n.getFullYear(),n.getMonth(),0));}
  else if(f.preset==="30"){const a=new Date(n);a.setDate(a.getDate()-29);from=ymd(a);to=ymd(n);}
  else if(f.preset==="year"){from=n.getFullYear()+"-01-01";to=n.getFullYear()+"-12-31";}
  else if(f.preset==="custom"){from=f.from||"";to=f.to||"";}

}
function rangeLabel(){

}

function pairs(list){
  const m=new Map();

    if(d.from===a)p.ab+=d.amount;else p.ba+=d.amount;p.ids.add(d.eid);});

/* ---------- GitHub storage: one JSON file in a private repo, merged record by record ---------- */
const CFG=Object.assign({owner:"",repo:"",branch:"main",path:"data.json",photos:"photos",lock:null},window.WK_CONFIG||{});

const TOKEN_KEY="wk-token:"+REPO_ID, CACHE_KEY="wk-cache:"+REPO_ID;

const emptyData=()=>{const o={version:1,app:"Wang-Kicau",config:{},deleted:{}};COLS.forEach(c=>o[c]={});return o;};
function normalizeData(d){d=d&&typeof d==="object"?d:{};const o=emptyData();COLS.forEach(c=>o[c]=d[c]&&typeof d[c]==="object"?d[c]:{});o.config=d.config||{};o.deleted=d.deleted||{};return o;}
/* newest edit to each record wins; deletions are remembered as tombstones */
function mergeData(a,b){
  a=normalizeData(a);b=normalizeData(b);const out=emptyData();
  const del=Object.assign({},a.deleted);Object.entries(b.deleted).forEach(([k,t])=>{del[k]=Math.max(del[k]||0,+t||0);});
  COLS.forEach(col=>{const A=a[col],B=b[col];new Set([...Object.keys(A),...Object.keys(B)]).forEach(id=>{
    const ra=A[id],rb=B[id];const r=!ra?rb:!rb?ra:((+rb._u||0)>=(+ra._u||0)?rb:ra);
    const d=del[col+"/"+id];if(d&&d>=(+r._u||0))return;out[col][id]=r;});});
  out.config=(+b.config._u||0)>=(+a.config._u||0)?b.config:a.config;
  out.deleted=del;return out;
}
const G={token:ls.get(TOKEN_KEY)||"",data:emptyData(),sha:null,etag:null,dirty:false,pushing:false,again:false,timer:null,
  status:"idle",msg:"",lastSync:0,pendingRender:false};

function saveCache(){ls.set(CACHE_KEY,{data:G.data,sha:G.sha,dirty:G.dirty,lastSync:G.lastSync});}

}
const strip=d=>{const o=Object.assign({},d);delete o.id;return o;};

async function put(col,id,data){G.data[col][id]=Object.assign(strip(data),{_u:Date.now()});delete G.data.deleted[col+"/"+id];touch();return true;}

/* GitHub REST helpers */
const encPath=p=>String(p).split("/").map(encodeURIComponent).join("/");
const b64enc=str=>{const bytes=new TextEncoder().encode(str);let bin="";for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin);};
const b64dec=b64=>new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g,"")),c=>c.charCodeAt(0)));
const b64bytes=b64=>Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const blobB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob);});
function api(path,opts={},token=G.token){
  return fetch(`https://api.github.com/repos/${encPath(CFG.owner)}/${encPath(CFG.repo)}${path?"/"+path:""}`,Object.assign({cache:"no-store"},opts,{
    headers:Object.assign({Authorization:"Bearer "+token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opts.headers||{})}));
}
async function httpErr(r){let m="";try{m=(await r.json()).message||"";}catch(e){}
  const e=new Error(m||("HTTP "+r.status));e.status=r.status;
  e.friendly=r.status===401?"The group's access key was rejected or has expired. Ask the group owner to renew it.":
    r.status===404?"The data repo wasn't found. Ask the group owner to check the setup.":
    r.status===403&&/rate limit/i.test(m)?"GitHub's hourly limit was reached. Changes are kept on this device and will sync shortly.":
    r.status===403?"The access key can't write to the data repo. Ask the group owner to check its permissions.":
    "GitHub returned an error ("+r.status+"). Changes are kept on this device.";
  return e;}
async function fetchRemote(useEtag){
  const q=`contents/${encPath(CFG.path)}?ref=${encodeURIComponent(CFG.branch)}`;
  const r=await api(q,{headers:useEtag&&G.etag?{"If-None-Match":G.etag}:{}});
  if(r.status===304)return {unchanged:true};
  if(r.status===404)return {data:null,sha:null}; // file not created yet: the first save creates it
  if(!r.ok)throw await httpErr(r);
  const j=await r.json();G.etag=r.headers.get("ETag")||null;
  let text="";
  if(j.encoding==="base64"&&j.content)text=b64dec(j.content);
  else{const rr=await api(q,{headers:{Accept:"application/vnd.github.raw+json"}});if(!rr.ok)throw await httpErr(rr);text=await rr.text();}
  return {data:text.trim()?JSON.parse(text):null,sha:j.sha};
}
async function putRemote(data,sha){
  const body={message:"Update Wang-Kicau ledger",content:b64enc(JSON.stringify(data,null,1)),branch:CFG.branch};if(sha)body.sha=sha;
  const r=await api(`contents/${encPath(CFG.path)}`,{method:"PUT",body:JSON.stringify(body)});
  if(r.ok){const j=await r.json();return {ok:true,sha:j.content&&j.content.sha};}
  if(r.status===409||r.status===422)return {ok:false,conflict:true};
  throw await httpErr(r);
}
function applyRemote(merged){
  const before=JSON.stringify(G.data);G.data=merged;
  if(JSON.stringify(merged)!==before){rebuild();safeRender();}
}
function safeRender(){const a=document.activeElement;
  if(a&&a.closest&&a.closest("#view")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){G.pendingRender=true;return;}renderAll();}
document.addEventListener("focusout",()=>{if(G.pendingRender){setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest("#view")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){G.pendingRender=false;renderAll();}},0);}});
function schedulePush(){clearTimeout(G.timer);setSync("pending");G.timer=setTimeout(push,1200);}
async function push(){
  if(!G.token)return;
  if(G.pushing){G.again=true;return;}
  G.pushing=true;setSync("saving");
  try{
    for(let attempt=0;attempt<5;attempt++){
      const remote=await fetchRemote(false);
      const merged=mergeData(remote.data,G.data);
      applyRemote(merged);
      const r=await putRemote(merged,remote.sha);
      if(r.ok){G.sha=r.sha;G.dirty=false;G.lastSync=Date.now();saveCache();setSync("ok");break;}
      await new Promise(res=>setTimeout(res,400+Math.random()*600));
      if(attempt===4)throw Object.assign(new Error("conflict"),{friendly:"Someone else was saving at the same moment. Retrying shortly."});
    }
  }catch(e){console.warn(e);setSync(navigator.onLine===false?"offline":"error",e.friendly||"Couldn't reach GitHub. Changes are kept on this device.");if(e.status===401)lockDevice(true);}
  finally{G.pushing=false;if(G.again){G.again=false;push();}}
}
async function pull(){
  if(!G.token||G.pushing)return;
  try{
    const remote=await fetchRemote(true);
    if(remote.unchanged){G.lastSync=Date.now();saveCache();if(!G.dirty)setSync("ok");return;}
    G.sha=remote.sha;applyRemote(mergeData(remote.data,G.data));G.lastSync=Date.now();saveCache();
    if(G.dirty)push();else setSync("ok");
  }catch(e){console.warn(e);setSync(navigator.onLine===false?"offline":"error",e.friendly||"Couldn't reach GitHub.");if(e.status===401)lockDevice(true);}
}
function ago(t){if(!t)return "never";const s=Math.round((Date.now()-t)/1000);if(s<10)return "just now";if(s<60)return s+"s ago";const m=Math.round(s/60);if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return fmtShort(ymd(new Date(t)));}
function setSync(st,msg){G.status=st;if(msg!=null)G.msg=msg;else if(st==="ok")G.msg="";renderSyncPill();}

async function deriveKey(pass,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function unlockToken(pass){
  const L=CFG.lock;const key=await deriveKey(pass.trim().normalize("NFC"),b64bytes(L.salt),L.iter||310000);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64bytes(L.iv)},key,b64bytes(L.data));return new TextDecoder().decode(pt);}

      <div class="fld" style="text-align:left"><label for="lock-pass">Group passphrase</label><input class="ctl" id="lock-pass" type="password" autocomplete="current-password" autofocus></div>
      <div class="err" id="lock-err" ${msg?"":"hidden"}>${esc(msg||"")}</div>
      <button class="btn primary" type="submit" id="lock-go" style="width:100%">Unlock</button>
      <p class="small muted" style="margin:0">Don't have it? Ask whoever set up the group.</p>`
    :`<p class="muted">This copy of Wang-Kicau isn't connected to a data repo yet. The group owner needs to open <b>setup.html</b> and paste the result into <b>assets/config.js</b> (see the README).</p>`}
  </form>`;
  setTimeout(()=>$("#lock-pass")?.focus(),50);

function hideLock(){const el=$("#lock");el.hidden=true;el.innerHTML="";document.body.classList.remove("locked");}
async function tryUnlock(){
  const pass=$("#lock-pass").value;const err=$("#lock-err");const btn=$("#lock-go");
  if(!pass.trim()){err.hidden=false;err.textContent="Type the passphrase first.";return;}
  btn.disabled=true;btn.textContent="Unlocking…";

  try{const r=await api("",{},token);if(!r.ok)throw await httpErr(r);}
  catch(e){btn.disabled=false;btn.textContent="Unlock";err.hidden=false;err.textContent=e.friendly||"Couldn't reach GitHub. Check your connection and try again.";return;}

let syncStarted=false;

/* ---------- bill photos stored in the data repo ---------- */
const photoCache=new Map();
function photoURL(path){
  if(photoCache.has(path))return photoCache.get(path);
  const p=(async()=>{const r=await api(`contents/${encPath(path)}?ref=${encodeURIComponent(CFG.branch)}`,{headers:{Accept:"application/vnd.github.raw+json"}});
    if(!r.ok)throw await httpErr(r);return URL.createObjectURL(new Blob([await r.arrayBuffer()],{type:"image/jpeg"}));})();
  photoCache.set(path,p);p.catch(()=>photoCache.delete(path));return p;
}
function hydratePhotos(root){(root||document).querySelectorAll("img[data-rpath]").forEach(img=>{if(img.dataset.loaded)return;img.dataset.loaded="1";
  photoURL(img.dataset.rpath).then(u=>{img.src=u;img.dataset.src=u;}).catch(()=>{img.alt="Photo unavailable";img.classList.add("missing");});});}
S.assets={async upload(blob){
  const path=(CFG.photos||"photos").replace(/\/+$/,"")+"/"+uid()+".jpg";

function expenseChanges(o,n){

  [["desc","Name"],["amount","Amount"],["date","Date"],["paidBy","Paid by"],["cat","Category"],["eventId","Event"]].forEach(([k,l])=>{

  return head+`<div class="xdetail">

      </div>

function eventStats(list){
  const st={};const g=k=>st[k]||(st[k]={total:0,n:0,owed:0,min:"",max:"",people:new Set(),cats:{}});
  list.forEach(x=>{const s=g(evOf(x));const v=amountFor(x,S.f.person);s.total+=v;s.n++;s.owed+=owedOf(x);
    if(!s.min||x.date<s.min)s.min=x.date;if(!s.max||x.date>s.max)s.max=x.date;
    s.people.add(x.paidBy);Object.keys(x.shares||{}).forEach(k=>s.people.add(k));s.cats[x.cat]=(s.cats[x.cat]||0)+v;});
  return st;
}

async function submitEvent(){
  const name=$("#ev-name").value.trim(),start=$("#ev-start").value,end=$("#ev-end").value,note=$("#ev-note").value.trim();

  let color=o?.color;if(color==null){const used=new Set(S.events.map(e=>e.color));color=0;while(used.has(color)&&color<9)color++;if(used.has(color))color=S.events.length%10;}

  closeModal();

function autoEvent(date){
  const m=S.events.filter(e=>!e.closed&&e.start&&date>=e.start&&(!e.end||date<=e.end));

/* ---------- dashboard ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}
const weekStart=d=>{const x=new Date(d);const off=(x.getDay()+6)%7;x.setDate(x.getDate()-off);return x;};
function trendSVG(list,mode){
  const p=S.f.person;const {from,to}=range();const dates=list.map(x=>x.date).sort();
  let a=dates[0],b=dates[dates.length-1];
  if(from&&S.f.preset!=="all"&&!S.f.event){a=from;b=to&&to<today()?to:(b>today()?b:today());if(to&&b>to)b=to;}
  const buckets=[];const idx={};
  if(mode==="week"){
    for(let d=weekStart(parseD(a));ymd(d)<=b;d.setDate(d.getDate()+7)){const k=ymd(d);idx[k]=buckets.length;
      buckets.push({k,label:dm(d),full:"Week of "+fmtShort(k),v:0});}
    list.forEach(x=>{const k=ymd(weekStart(parseD(x.date)));if(k in idx)buckets[idx[k]].v+=amountFor(x,p);});
  }else{
    const s=parseD(a);s.setDate(1);const e=parseD(b);
    for(let d=new Date(s);d<=e;d.setMonth(d.getMonth()+1)){const k=ymd(d).slice(0,7);idx[k]=buckets.length;
      buckets.push({k,label:MON3[d.getMonth()]+(d.getMonth()===0||buckets.length===0?" "+String(d.getFullYear()).slice(2):""),full:d.toLocaleDateString("en-GB",{month:"long",year:"numeric"}),v:0});}
    list.forEach(x=>{const k=x.date.slice(0,7);if(k in idx)buckets[idx[k]].v+=amountFor(x,p);});
  }
  const W=680,H=230,L=62,R=8,T=12,Bm=26;const max=niceMax(Math.max(...buckets.map(b=>b.v),0));
  const iw=W-L-R,ih=H-T-Bm,bw=iw/Math.max(buckets.length,1);
  let g="";for(let i=0;i<=4;i++){const y=T+ih-ih*i/4;g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axis" x="${L-8}" y="${y+4}" text-anchor="end">${esc(i?cf.format(max*i/4):"0")}</text>`;}
  const step=Math.ceil(buckets.length/10);
  const bars=buckets.map((bk,i)=>{const h=bk.v/max*ih;const w=Math.min(Math.max(bw*.62,1),56);const x=L+i*bw+(bw-w)/2;
    return `<rect class="bar" x="${x.toFixed(1)}" y="${(T+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,bk.v?1.5:0).toFixed(1)}" rx="3"><title>${esc(bk.full)}: ${esc(rp(bk.v))}</title></rect>`+
      (i%step===0?`<text class="axis" x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(bk.label)}</text>`:"");}).join("");
  const nz=buckets.filter(b=>b.v);const avg=nz.length?buckets.reduce((s,b)=>s+b.v,0)/buckets.length:0;
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending per ${mode}">${g}${bars}</svg>`,avg,n:buckets.length};
}
const chevron=`<svg class="acc-chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function viewDash(){

  const byCat={};list.forEach(x=>{const v=amountFor(x,p);if(v)byCat[x.cat||"Other"]=(byCat[x.cat||"Other"]||0)+v;});
  const byEv={};list.forEach(x=>{const v=amountFor(x,p);if(v)byEv[evOf(x)]=(byEv[evOf(x)]||0)+v;});
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const evArr=Object.entries(byEv).sort((a,b)=>b[1]-a[1]);
  const top=list.slice().sort((a,b)=>amountFor(b,p)-amountFor(a,p)).slice(0,5).map(x=>`<div><span style="min-width:0"><b>${esc(x.desc||x.cat)}</b><br><span class="small muted">${esc(fmtShort(x.date))} · ${esc(x.cat)}${evOf(x)?" · "+esc(evName(x.eventId)):""} · ${esc(mname(x.paidBy))} paid</span></span><span class="num">${esc(rp(amountFor(x,p)))}</span></div>`).join("");
  const owedSub=p?`${esc(mname(p))} owes ${esc(rp(B[p]?.owes||0))} · gets back ${esc(rp(B[p]?.gets||0))}`:`${P.length} transfer${P.length===1?"":"s"} to settle up`;
  return `<div class="kpis two">
    <div class="kpi acc ${openSpend?"open":""}">
      <button class="kpi-head" data-act="acc" data-id="spend" aria-expanded="${openSpend}">
        <span><span class="label">${p?esc(mname(p))+"'s spending":"Total spending (group)"}</span><span class="v num">${esc(rp(total))}</span><span class="s">${esc(ctxLabel())}</span></span>
        <span class="acc-tog">See details ${chevron}</span></button>
      ${openSpend?`<div class="acc-body"><div class="hbars" style="margin-top:0">${spendBody}</div></div>`:""}
    </div>
    <div class="kpi acc owed ${openOwed?"open":""}">
      <button class="kpi-head" data-act="acc" data-id="owed" aria-expanded="${openOwed}">
        <span><span class="label">Still owed</span><span class="v num">${esc(rp(toTransfer))}</span><span class="s">${owedSub}</span></span>
        <span class="acc-tog">Who pays whom ${chevron}</span></button>
      ${openOwed?`<div class="acc-body">${owedBody}</div>`:""}
    </div>
  </div>
  <div class="card"><div class="sechead"><div><h2>Spending per ${S.trend==="week"?"week":"month"}</h2><span class="small muted">${p?esc(mname(p))+"'s share":"All bills"} · ${esc(ctxLabel())} · avg ${esc(rp(t.avg))} per ${S.trend}</span></div>

/* ---- by-items split: each person pays for the items they had, plus the bill's charges (service, PB1/PPN, discounts)
   at the same percentage the bill applies, so people who had nothing pay nothing ---- */
const lineTotal=it=>it.qty>1&&it.price?`${it.qty} × ${rp(it.price)} = <b>${rp(it.amount)}</b>`:it.amount?`<b>${rp(it.amount)}</b>`:"";
function setItem(it,{price,qty}){if(price!=null)it.price=Math.max(0,price);if(qty!=null)it.qty=Math.max(1,Math.min(999,qty));it.amount=it.price*it.qty;
  const el=$("#xi-t-"+it.k);if(el)el.innerHTML=lineTotal(it);const dn=document.querySelector(`[data-act="item-qty"][data-id="${it.k}"][data-d="-1"]`);if(dn)dn.disabled=it.qty<=1;}
function taggedPeople(){const s=new Set();S.form.items.forEach(it=>{if(+it.amount)it.who.forEach(i=>s.add(i));});return S.members.map(m=>m.id).filter(i=>s.has(i));}
function itemSubtotals(){
  const f=S.form;const all=S.members.map(m=>m.id);const tagged=taggedPeople();const fallback=tagged.length?tagged:all;
  const sub={};let isum=0,untagged=0;
  f.items.forEach(it=>{const a=+it.amount||0;if(!a)return;isum+=a;if(!it.who.size)untagged++;
    const w=it.who.size?all.filter(i=>it.who.has(i)):fallback;if(!w.length)return;
    const base=Math.floor(a/w.length);let rem=a-base*w.length;w.forEach(i=>{sub[i]=(sub[i]||0)+base+(rem>0?1:0);if(rem>0)rem--;});});
  return {sub,isum,fallback,tagged,untagged};
}
const chargeList=()=>S.form.charges.filter(c=>+c.amount>0).map(c=>Object.assign({},c,{signed:(c.less?-1:1)*(+c.amount)}));
const chargeSum=()=>chargeList().reduce((a,c)=>a+c.signed,0);
function chargePcts(isum){const out={};let base=isum;S.form.charges.forEach(c=>{const a=+c.amount||0;out[c.k]=base&&a?a/base*100:0;if(!c.less)base+=a;});return out;}
const fmtPct=p=>p?(Math.round(p*10)/10).toString().replace(".",",")+"%":"";
function syncItemsTotal(){
  const f=S.form;if(f.split!=="items"||!f.amountLinked)return;
  const {isum}=itemSubtotals();const t=Math.max(0,isum+chargeSum());
  if(t!==f.amount){f.amount=t;const el=$("#xf-amount");if(el)el.value=t?nf.format(t):"";}
}
function itemsBreakdown(){
  const f=S.form;const {sub,isum,fallback,tagged,untagged}=itemSubtotals();
  const charges=chargeList();const csum=charges.reduce((a,c)=>a+c.signed,0);const total=f.amount;const other=total-isum-csum;
  const ids=S.members.map(m=>m.id).filter(i=>sub[i]);
  const pays={};let tot=0;
  if(isum&&total){ids.forEach(i=>{pays[i]=Math.round(total*sub[i]/isum);tot+=pays[i];});
    const diff=total-tot;if(diff&&ids.length){const top=ids.slice().sort((a,b)=>pays[b]-pays[a])[0];pays[top]+=diff;}}
  const rows=ids.map(i=>({id:i,items:sub[i],charges:charges.map(c=>Math.round(c.signed*sub[i]/isum)),other:Math.round(other*sub[i]/isum),pays:pays[i]||0}));
  return {rows,charges,other,isum,total,fallback,tagged,untagged};
}
function computeShares(){
  const f=S.form;const out={};
  if(f.split==="equal"){
    const ids=S.members.map(m=>m.id).filter(id=>f.inc.has(id));const n=ids.length;if(!n||!f.amount)return out;
    const base=Math.floor(f.amount/n);let rem=f.amount-base*n;ids.forEach(id=>{out[id]=base+(rem>0?1:0);if(rem>0)rem--;});
  }else if(f.split==="custom"){S.members.forEach(m=>{const v=+f.custom[m.id]||0;if(v>0)out[m.id]=v;});}
  else{const b=itemsBreakdown();if(!b.isum||!b.total)return out;b.rows.forEach(r=>{if(r.pays>0)out[r.id]=r.pays;});}
  return out;
}
function whoLabel(it){
  if(it.who.size)return "Had by:";
  const {tagged}=itemSubtotals();
  return tagged.length?`Not tagged · shared by ${tagged.map(mname).join(", ")} · or pick:`:"Who had this?";
}
function renderSplit(){
  const f=S.form;const el=$("#xf-split");if(!el)return;
  const paidTag=id=>id===f.paidBy?' <span class="small muted">(paid)</span>':"";
  if(f.split==="items"){

async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url;});
    const max=1600;const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    const dataUrl=c.toDataURL("image/jpeg",0.85);
    return {canvas:c,blob,b64:dataUrl.split(",")[1],dataUrl,preview:URL.createObjectURL(blob)};
  }finally{URL.revokeObjectURL(url);}
}
/* grayscale + contrast stretch, optional upscale: thermal receipts read far better this way */
function ocrCanvas(src,{contrast=true,scale=1}={}){
  const w=Math.round(src.width*scale),h=Math.round(src.height*scale);
  const c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d",{willReadFrequently:true});

  const d=ctx.getImageData(0,0,w,h);const p=d.data;const hist=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=g;hist[g]++;}
  let lo=0,hi=255;
  if(contrast){const n=w*h,cut=n*0.02;let acc=0;for(lo=0;lo<255&&(acc+=hist[lo])<cut;lo++);acc=0;for(hi=255;hi>0&&(acc+=hist[hi])<cut;hi--);if(hi<=lo){lo=0;hi=255;}}
  const k=255/(hi-lo||1);
  for(let i=0;i<p.length;i+=4){const v=Math.max(0,Math.min(255,(p[i]-lo)*k));p[i]=p[i+1]=p[i+2]=v;}
  ctx.putImageData(d,0,0);return c;
}
let tessP=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Couldn't load "+src));document.head.appendChild(s);});}
function getTess(){
  if(!tessP){
    tessP=(async()=>{
      const base=new URL("tess/",document.baseURI).href;
      if(!window.Tesseract)await loadScript(base+"tesseract.min.js");
      // artifacts can't serve .gz files, so the language data ships as .wasm and the worker's fetch is pointed at it
      const shim=`const __f=self.fetch.bind(self);self.fetch=(u,o)=>__f(String(u).replace(/eng\\.traineddata\\.gz(\\?.*)?$/,"eng-traineddata.wasm"),o);importScripts(${JSON.stringify(base+"worker.min.js")});`;
      const workerPath=URL.createObjectURL(new Blob([shim],{type:"text/javascript"}));
      const w=await window.Tesseract.createWorker("eng",1,{workerPath,workerBlobURL:false,corePath:base,langPath:base.replace(/\/$/,""),cacheMethod:"none",
        logger:m=>{if(S.ocrProgress)S.ocrProgress(m);}});
      await w.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"});

async function ocrBill(canvas,setMsg){
  S.ocrProgress=m=>{if(!m||!m.status)return;const pct=Math.round((m.progress||0)*100);

  const w=await getTess();
  const variants=[{contrast:true,scale:1},{contrast:false,scale:1},{contrast:true,scale:1.6}];
  let best=null;
  for(const v of variants){
    const {data}=await w.recognize(ocrCanvas(canvas,v));
    const parsed=parseBill(data.text||"");
    const score=(parsed.consistent?1000:0)+parsed.items.length*10+(parsed.total?5:0);
    if(!best||score>best.score)best={text:data.text||"",parsed,score};
    if(parsed.consistent)break;
  }
  S.ocrProgress=null;

    ["Entertainment",/cinema|\bxxi\b|\bcgv\b|cinepolis|karaoke|netflix|spotify|bowling/],
    ["Health",/apotek|pharmacy|kimia farma|guardian|watsons|clinic|klinik|hospital|rumah sakit|dokter/],
    ["Shopping",/uniqlo|zara|ace hardware|ikea|informa|miniso|matahari/]];
  let category="";for(const [c,re] of rules){if(re.test(hay)&&cats().includes(c)){category=c;break;}}
  const consistent=items.length>0&&total>0&&(!subtotal||subtotal===isum)&&Math.abs(total-computed)<=Math.max(1000,total*0.01);
  return {merchant,date,total,items,isum,subtotal,tax,service,discount,taxLabel,category,consistent};
}
function billPrompt(src){
  return `You read bills and receipts for a shared-expense tracker used in Indonesia.
Amounts are Indonesian Rupiah (IDR). On Indonesian bills "." or "," are thousands separators: "45.000" = 45000, "Rp 1,250,000" = 1250000. Drop any cents.
${src}
Return ONLY a JSON object, no prose, with this shape:
{"merchant": string, "date": "YYYY-MM-DD" or null, "total": integer, "items": [{"name": string, "qty": number, "amount": integer}], "tax": integer, "service": integer, "discount": integer, "category": string}
Rules:
- "amount" is the line total for the item (quantity × unit price), not the unit price.
- "total" is the final amount paid, including tax (PB1/PPN) and service charge, after discounts and rounding.
- "tax", "service", "discount" are 0 when absent. "discount" is a positive number.
- Check the arithmetic: items should add up to the subtotal, and subtotal + service + tax − discount should equal the total. Use this to fix misread digits.
- Keep item names short, as printed. Skip lines that are subtotals, payments, change or cashier info.
- "category" must be exactly one of: ${JSON.stringify(cats())}.
- Dates on Indonesian bills are day-month-year. If the date is unclear use null. Today is ${today()}.
- If this is not a bill or receipt, return {"error": "not a bill"}.`;
}
function normalizeBill(r){
  if(!r||typeof r!=="object")throw {code:"parse"};
  if(r.error)throw {code:"notbill"};
  const n=v=>Math.max(0,Math.round(typeof v==="string"?digits(v):(+v||0)));
  const items=(Array.isArray(r.items)?r.items:[]).map(it=>({name:String(it?.name||"Item").slice(0,60),amount:n(it?.amount),qty:Math.max(1,Math.round(+it?.qty||1))})).filter(it=>it.amount>0).slice(0,40);
  const isum=items.reduce((a,b)=>a+b.amount,0);
  let total=n(r.total);if(!total)total=isum+n(r.tax)+n(r.service)-n(r.discount);
  if(!total&&!items.length)throw {code:"empty"};
  return {merchant:String(r.merchant||"").slice(0,80),date:isDate(r.date)?r.date:"",total,items,isum,tax:n(r.tax),service:n(r.service),discount:n(r.discount),taxLabel:"Tax",category:cats().includes(r.category)?r.category:"",consistent:true};
}
async function callSample(prompt,img,signal){
  const base={modelTier:"default",cache:false,signal};
  if(!img)return S.sample.json(prompt,base);
  const shapes=[[{data:img.b64,mediaType:"image/jpeg"}],[img.blob],[img.dataUrl]];
  let last;
  for(const images of shapes){
    try{return await S.sample.json(prompt,Object.assign({},base,{images}));}
    catch(e){last=e;const c=String(e?.code||"");if(!/invalid|unsupported|bad|type|image|schema|argument/i.test(c+" "+(e?.message||"")))throw e;}
  }
  throw last;
}
async function visionAvailable(){
  if(!S.sample||typeof S.sample.limits!=="function")return false;
  try{const l=await S.sample.limits();const v=l&&(l.images??l.maxImages??l.image);return !!v&&v!==0;}catch(e){return false;}
}
async function runScan(img,text){
  const f=S.form;if(!f)return;
  const ctrl=new AbortController();f.scan.ctrl=ctrl;f.scan.state="busy";f.scan.progress="";renderScan();
  const setMsg=m=>{if(S.form===f&&f.scan.state==="busy"){f.scan.progress=m;const el=$("#xf-scan .small");if(el)el.textContent=m;}};
  const cancelled=()=>ctrl.signal.aborted||S.form!==f;
  let bill=null,source="";
  try{
    // 1) Claude reading the photo directly, when this viewer supports images
    if(img&&await visionAvailable()){
      setMsg("Asking Claude to read the photo…");
      try{bill=normalizeBill(await callSample(billPrompt("Read the attached photo of a bill."),img,ctrl.signal));source="claude";}
      catch(e){if(e?.code==="cancelled"||cancelled())throw {code:"cancelled"};if(e?.code==="notbill")throw e;}
    }
    // 2) on-device text recognition
    let raw=text||"",parsed=null;
    if(!bill&&img){
      setMsg("Loading the text reader…");
      let r;try{r=await ocrBill(img.canvas,setMsg);}catch(e){console.warn(e);if(cancelled())throw {code:"cancelled"};throw {code:"ocr"};}
      if(cancelled())throw {code:"cancelled"};
      raw=r.text;parsed=r.parsed;f.scan.raw=raw;
    }
    if(!bill){
      parsed=parsed||parseBill(raw);
      // 3) ask Claude to tidy up only when the numbers don't add up
      if(!parsed.consistent&&S.sample&&raw.trim()){
        setMsg("Double-checking the numbers with Claude…");
        try{bill=normalizeBill(await callSample(billPrompt("Here is text read from a bill. It may contain recognition errors; fix them where the arithmetic makes it clear.\n\"\"\"\n"+raw.slice(0,6000)+"\n\"\"\""),null,ctrl.signal));source="claude";
          if(!bill.merchant)bill.merchant=parsed.merchant;}
        catch(e){if(e?.code==="cancelled"||cancelled())throw {code:"cancelled"};}
      }
      if(!bill){if(!parsed.total&&!parsed.items.length)throw {code:"empty"};bill=parsed;source="ocr";}
    }
    if(cancelled())return;
    applyBill(bill);
    f.scan.state="done";
    const diff=bill.items.length?bill.total-bill.isum:0;
    f.scan.msg=`${bill.items.length?bill.items.length+" item"+(bill.items.length>1?"s":"")+" found":"Total found"}${diff>0?" · "+rp(diff)+" tax & service":diff<0?" · "+rp(-diff)+" discount":""}. `+
      (bill.consistent?"Check the details, then tag who had what.":"Some numbers may be misread. Compare the total and items with the photo.");
    renderScan();
  }catch(e){
    if(S.form!==f)return;
    const c=e?.code||"";
    if(c==="cancelled"){f.scan.state=f.scan.preview?"done":"idle";f.scan.msg="Scan cancelled. Fill in the details by hand.";renderScan();return;}
    f.scan.state="error";
    f.scan.msg=c==="notbill"?"That doesn't look like a bill. Try a clearer, straight-on photo.":
      c==="ocr"?"The text reader couldn't start in this browser. Use “Paste text”, or fill in the details by hand.":
      c==="empty"||c==="parse"?"No amounts could be read. Try a sharper, well-lit photo with the total visible.":
      "Something went wrong reading the bill. Try again or fill it in by hand.";
    renderScan();
  }
}
function applyBill(b){
  const f=S.form;readFormFields();
  if(b.merchant)f.desc=b.merchant;
  if(b.date){f.date=b.date;if(!f.evManual)f.eventId=autoEvent(b.date);}
  if(b.total)f.amount=b.total;
  if(b.category)f.cat=b.category;
  if(b.items.length){f.split="items";f.items=b.items.map(it=>mkItem(it.name,it.amount,[],it.qty&&it.amount%it.qty===0?it.qty:1));
    f.charges=[];if(b.service)f.charges.push(mkCharge("Service charge",b.service));if(b.tax)f.charges.push(mkCharge(b.taxLabel||"Tax",b.tax));if(b.discount)f.charges.push(mkCharge("Discount",b.discount,true));
    f.amountLinked=f.amount===b.isum+(b.service||0)+(b.tax||0)-(b.discount||0);}
  $("#xf-desc").value=f.desc;$("#xf-date").value=f.date;$("#xf-amount").value=f.amount?nf.format(f.amount):"";
  fillFormSelects();renderSeg();renderSplit();
}
async function handleFile(file){
  const f=S.form;if(!f||!file)return;
  if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name||"")){f.scan.state="error";f.scan.msg="That file isn't an image. Upload a JPG or PNG photo of the bill.";renderScan();return;}
  let img;
  try{img=await prepImage(file);}catch(e){f.scan.state="error";f.scan.msg="Couldn't open that image. Try a JPG or PNG, or a screenshot of the bill.";renderScan();return;}
  if(f.scan.preview)try{URL.revokeObjectURL(f.scan.preview);}catch(e){}
  f.scan.preview=img.preview;f.scan.blob=img.blob;
  runScan(img,null);
}

async function toggleShare(eid,mid){
  const x=S.expenses.find(e=>e.id===eid);if(!x||!x.shares?.[mid])return;
  const shares=JSON.parse(JSON.stringify(x.shares));const s=shares[mid];s.paid=!s.paid;s.paidAt=s.paid?today():"";
  if(s.paid){s.markedBy=S.me||"";s.markedAt=Date.now();}else{delete s.markedBy;delete s.markedAt;}
  await patch("expenses",eid,{shares,updatedAt:Date.now()});
  logAct(s.paid?"paid":"unpaid",{eid,desc:x.desc,from:mid,to:x.paidBy,amount:+s.amount});
  toast(s.paid?`${mname(mid)}'s ${rp(s.amount)} marked as transferred`:`${mname(mid)}'s ${rp(s.amount)} marked as owed again`);
}
async function settlePair(a,b){
  const list=fullList().filter(x=>x.paidBy===a||x.paidBy===b);const before=[];const t=today();
  const [sa,sb]=[a,b].sort();const p=pairs(fullList()).find(p=>p.a===sa&&p.b===sb);
  for(const x of list){const other=x.paidBy===a?b:a;const s=x.shares?.[other];if(!s||s.paid||!(+s.amount))continue;
    before.push({id:x.id,shares:JSON.parse(JSON.stringify(x.shares))});
    const shares=JSON.parse(JSON.stringify(x.shares));shares[other].paid=true;shares[other].paidAt=t;shares[other].markedBy=S.me||"";shares[other].markedAt=Date.now();
    await patch("expenses",x.id,{shares,updatedAt:Date.now()});}
  if(!before.length)return;
  const amt=p&&p.amount?p.amount:0,fr=p?p.from:a,to=p?p.to:b;
  logAct("settle",{from:fr,to,amount:amt,n:before.length,eids:before.map(u=>u.id)});
  toast(p&&p.amount?`Marked ${rp(p.amount)} from ${mname(p.from)} to ${mname(p.to)} as transferred`:`Cleared shares between ${mname(a)} and ${mname(b)}`,
    async()=>{for(const u of before)await patch("expenses",u.id,{shares:u.shares,updatedAt:Date.now()});logAct("unsettle",{from:fr,to,amount:amt,n:before.length});toast("Transfer undone");});
}

    const color=S.members.reduce((a,m)=>Math.max(a,(m.color??0)+1),0);
    await put("members",uid(),{name,color,colorKey,createdAt:Date.now()});setTimeout(()=>$("#mem-new")?.focus(),20);}
  else if(t.id==="cat-form"){const v=$("#cat-new").value.trim();if(!v)return;if(cats().some(c=>c.toLowerCase()===v.toLowerCase())){toast(v+" already exists.");return;}
    await saveConfig({categories:[...cats(),v]});setTimeout(()=>$("#cat-new")?.focus(),20);}
});
/* drag & drop a bill onto the scan box */
document.addEventListener("dragover",e=>{const z=e.target.closest&&e.target.closest("#xf-scan");if(z){e.preventDefault();z.classList.add("drag");}});
document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("#xf-scan");if(z)z.classList.remove("drag");});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("#xf-scan");if(!z)return;e.preventDefault();z.classList.remove("drag");const file=e.dataTransfer?.files?.[0];if(file)handleFile(file);});
/* paste an image while the form is open */
document.addEventListener("paste",e=>{if(!S.form||S.readOnly||S.form.scan.state==="busy")return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));if(it){e.preventDefault();handleFile(it.getAsFile());}});

/* ---------- boot ---------- */
rebuild();renderAll();
if(!G.token)showLock();else{setSync("idle");startSync();}
})();
</script>

</body>
